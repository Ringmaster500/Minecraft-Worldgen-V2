tasks.register('verifyPhase14', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 14 JSON AST Schema Ingestion (All 293 Nodes & 24 Categories)'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.worldgenv2.Phase14VerificationTest'
