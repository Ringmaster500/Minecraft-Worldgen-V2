plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
            jvmArgument '-Xmx8G'
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            // Dev-only remote control (screenshots/input), see DevBridge.java and tools/dev.ps1
            systemProperty 'worldgenv2.devbridge', '5006'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // fastnoiselite or companion math libs can be bundled or embedded
    // tests that touch JSON-facing engine code (placement rules) need the same libraries the mod compiles against
    testCompileOnly files({ sourceSets.main.compileClasspath })
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('verifyPhase3And4', JavaExec) {
    group = 'verification'
    description = 'Runs the BiCarta, Phase 3 & Phase 4 verification suite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase3And4VerificationTest'
}

