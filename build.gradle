tasks.register('verifyWorldHeight', JavaExec) {
    group = 'verification'
    description = 'Verifies World Height presets and arbitrary manual configuration'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.worldgenv2.WorldHeightConfigTest'
}

tasks.register('verifyEngine', JavaExec) {
    group = 'verification'
    description = 'Runs the standalone verification suites'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase2VerificationTest'
    finalizedBy('verifyPhase3And4', 'verifyPhase7', 'verifyPhase8', 'verifyPhase9', 'verifyPhase10', 'verifyPhase11', 'verifyPhase12', 'verifyPhase13', 'verifyPhase14', 'verifyWorldHeight')
}
