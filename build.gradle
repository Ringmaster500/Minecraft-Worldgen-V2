plugins {
    id 'java-library'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    validateAccessTransformers = true

    runs {
        client {
            client()
            jvmArgument '-Xmx8G'
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // fastnoiselite or companion math libs can be bundled or embedded
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('verifyPhase3And4', JavaExec) {
    group = 'verification'
    description = 'Runs the BiCarta, Phase 3 & Phase 4 verification suite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase3And4VerificationTest'
}

tasks.register('verifyPhase7', JavaExec) {
    group = 'verification'
    description = 'Verifies climate biomes, caves, rivers and 3D underground biomes'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase7VerificationTest'
}

tasks.register('verifyPhase8', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 8 Curves & Vector Provider framework'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase8VerificationTest'
}

tasks.register('verifyPhase9', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 9 Advanced Density Nodes & Caching Infrastructure'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase9VerificationTest'
}

tasks.register('verifyPhase10', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 10 Positions Providers, Scanners & Assignments'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase10VerificationTest'
}

tasks.register('verifyPhase11', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 11 Block Mask System & Advanced Prop Operators'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase11VerificationTest'
}

tasks.register('verifyPhase12', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 12 Procedural Graph Generator Subsystem'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.worldgenv2.Phase12VerificationTest'
}

tasks.register('verifyPhase13', JavaExec) {
    group = 'verification'
    description = 'Verifies Phase 13 Prop Runtime Context Precision & Dynamic Chunk Bounds'
    classpath = sourceSets.test.runtimeClasspath
